[project]
name = "md2x"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kesbie", email = "kesbie.nguyen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "markitdown[all]>=0.1.9",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
md2x = "md2x:main"

# hatchling là backend thuần Python: cài được bằng pip ở mọi nền tảng,
# kể cả Android/Termux (uv_build không phát hành wheel cho Android).
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md2x"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
]
