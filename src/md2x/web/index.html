<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>md2x — Convert tài liệu sang Markdown</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #949cad;
    --accent: #4f8cff;
    --ok: #3fb950;
    --err: #f85149;
    --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --border: #dfe3ea;
      --text: #10131a; --muted: #5c6575; --accent: #2563eb;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  header {
    padding: 22px 24px 14px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { padding: 0 24px 40px; max-width: 1400px; margin: 0 auto; }
  .layout { display: grid; grid-template-columns: 380px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .card + .card { margin-top: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  #drop {
    border: 2px dashed var(--border); border-radius: var(--radius);
    padding: 26px 16px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.hot { border-color: var(--accent); background: var(--panel-2); }
  #drop .big { font-size: 15px; font-weight: 600; }
  #drop .small { color: var(--muted); font-size: 12.5px; margin-top: 6px; }

  textarea, input[type=text] {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
    font: inherit; resize: vertical;
  }
  textarea { min-height: 72px; font-size: 13.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }

  button {
    font: inherit; font-weight: 600; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); padding: 8px 14px; cursor: pointer;
    transition: filter .12s, border-color .12s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; padding: 11px; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  ul.queue { list-style: none; margin: 10px 0 0; padding: 0; max-height: 220px; overflow: auto; }
  ul.queue li {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    background: var(--panel-2); border-radius: 7px; margin-bottom: 5px; font-size: 13px;
  }
  ul.queue .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.queue .size { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  ul.queue .x { cursor: pointer; color: var(--muted); border: 0; background: none; padding: 0 4px; font-size: 16px; }
  ul.queue .x:hover { color: var(--err); }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; }
  .tab {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel-2); cursor: pointer; font-size: 13px; white-space: nowrap;
  }
  .tab.active { border-color: var(--accent); color: var(--accent); }
  .tab.bad { border-color: var(--err); color: var(--err); }

  pre.out {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px; margin: 0; min-height: 420px; max-height: 68vh; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .rendered {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px 20px; min-height: 420px; max-height: 68vh; overflow: auto;
  }
  .rendered :is(h1,h2,h3) { margin: 1em 0 .4em; line-height: 1.3; }
  .rendered table { border-collapse: collapse; margin: 10px 0; display: block; overflow-x: auto; }
  .rendered td, .rendered th { border: 1px solid var(--border); padding: 5px 9px; font-size: 13px; }
  .rendered th { background: var(--bg); text-align: left; font-weight: 600; }
  .rendered code { background: var(--bg); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .rendered pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .rendered img { max-width: 100%; }

  .meta { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .err-box { color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent);
             border: 1px solid var(--err); border-radius: 8px; padding: 12px; font-size: 13.5px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--accent); color: var(--text);
    padding: 9px 16px; border-radius: 999px; font-size: 13.5px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>md2x</h1>
  <span class="sub">docx · xlsx · pptx · pdf · html · csv · ảnh · audio → Markdown (dùng markitdown)</span>
</header>

<main>
<div class="layout">
  <!-- Cột trái: nguồn -->
  <section>
    <div class="card">
      <h2>Nguồn file</h2>
      <div id="drop">
        <div class="big">Kéo thả file vào đây</div>
        <div class="small">hoặc bấm để chọn — có thể chọn nhiều file</div>
      </div>
      <input id="picker" type="file" multiple hidden />
      <ul class="queue" id="queue"></ul>
      <div class="hint" id="exts"></div>
    </div>

    <div class="card">
      <h2>Hoặc dán URL</h2>
      <textarea id="urls" placeholder="https://example.com/bao-cao.pdf&#10;https://www.youtube.com/watch?v=...&#10;(mỗi dòng một URL)"></textarea>
    </div>

    <div class="card">
      <button class="primary" id="go">Convert sang Markdown</button>
      <div class="hint" id="status">Sẵn sàng.</div>
    </div>
  </section>

  <!-- Cột phải: kết quả -->
  <section class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 10px;">
      <h2 style="margin:0">Kết quả</h2>
      <div class="row">
        <button id="btn-view" disabled>Xem dạng render</button>
        <button id="btn-copy" disabled>Copy</button>
        <button id="btn-dl" disabled>Tải .md</button>
        <button id="btn-zip" disabled>Tải tất cả (.zip)</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <pre class="out" id="out">Chưa có kết quả. Chọn file hoặc dán URL rồi bấm Convert.</pre>
    <div class="rendered" id="rendered" hidden></div>
    <div class="meta" id="meta" style="margin-top:8px"></div>
  </section>
</div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

// Đường dẫn API tính tương đối theo trang hiện tại, để app chạy được cả khi
// nginx đặt dưới subpath (ví dụ https://tool.abc.com/md2x/).
const API = (() => {
  let base = location.pathname;
  if (!base.endsWith("/")) base = base.slice(0, base.lastIndexOf("/") + 1);
  return (p) => base + "api/" + p;
})();
let queue = [];        // File[]
let results = [];      // kết quả từ server
let active = 0;        // tab đang chọn
let renderMode = false;

/* ---------- hàng đợi file ---------- */
function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 ** 2) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 ** 2).toFixed(1) + " MB";
}
function addFiles(list) {
  for (const f of list) {
    if (!queue.some((q) => q.name === f.name && q.size === f.size)) queue.push(f);
  }
  renderQueue();
}
function renderQueue() {
  const ul = $("queue");
  ul.innerHTML = "";
  queue.forEach((f, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span class="name"></span><span class="size">${fmtSize(f.size)}</span><button class="x" title="Bỏ">×</button>`;
    li.querySelector(".name").textContent = f.name;
    li.querySelector(".x").onclick = () => { queue.splice(i, 1); renderQueue(); };
    ul.appendChild(li);
  });
}

const drop = $("drop");
drop.onclick = () => $("picker").click();
$("picker").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
["dragenter", "dragover"].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("hot"); }));
["dragleave", "drop"].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("hot"); }));
drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());

/* ---------- convert ---------- */
$("go").onclick = async () => {
  const urls = $("urls").value.trim();
  if (!queue.length && !urls) { toast("Chưa chọn file hoặc URL nào"); return; }

  const fd = new FormData();
  queue.forEach((f) => fd.append("files", f, f.name));
  fd.append("urls", urls);

  setBusy(true, `<span class="spinner"></span> Đang convert ${queue.length + (urls ? urls.split("\n").filter(Boolean).length : 0)} mục...`);
  try {
    const res = await fetch(API("convert"), { method: "POST", body: fd });
    if (!res.ok) {
      // 413 thường do reverse proxy chặn, body trả về là HTML chứ không phải JSON.
      if (res.status === 413) {
        throw new Error("File quá lớn — reverse proxy từ chối (client_max_body_size).");
      }
      const t = await res.json().catch(() => ({}));
      throw new Error(t.detail || `HTTP ${res.status}`);
    }
    const data = await res.json();
    results = data.results || [];
    active = 0;
    renderTabs();
    showActive();
    const okN = results.filter((r) => r.ok).length;
    setBusy(false, `Xong: ${okN}/${results.length} thành công.`);
  } catch (err) {
    setBusy(false, "");
    $("status").innerHTML = `<span style="color:var(--err)">Lỗi: ${escapeHtml(err.message)}</span>`;
  }
};

function setBusy(busy, msg) {
  $("go").disabled = busy;
  if (msg) $("status").innerHTML = msg;
}

/* ---------- hiển thị ---------- */
function renderTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  results.forEach((r, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === active ? " active" : "") + (r.ok ? "" : " bad");
    b.textContent = (r.ok ? "" : "⚠ ") + shortName(r.source);
    b.title = r.source;
    b.onclick = () => { active = i; renderTabs(); showActive(); };
    tabs.appendChild(b);
  });
  const anyOk = results.some((r) => r.ok);
  $("btn-zip").disabled = !anyOk;
}
function shortName(s) {
  if (s.length <= 28) return s;
  return s.slice(0, 14) + "…" + s.slice(-12);
}
function showActive() {
  const r = results[active];
  const out = $("out"), rendered = $("rendered");
  if (!r) return;
  if (!r.ok) {
    out.hidden = false; rendered.hidden = true;
    out.innerHTML = `<div class="err-box">${escapeHtml(r.error || "Lỗi không rõ")}</div>`;
    $("meta").textContent = r.source;
    ["btn-copy", "btn-dl", "btn-view"].forEach((b) => ($(b).disabled = true));
    return;
  }
  ["btn-copy", "btn-dl", "btn-view"].forEach((b) => ($(b).disabled = false));
  if (renderMode) {
    out.hidden = true; rendered.hidden = false;
    rendered.innerHTML = miniMarkdown(r.markdown);
  } else {
    out.hidden = false; rendered.hidden = true;
    out.textContent = r.markdown || "(rỗng)";
  }
  const lines = (r.markdown.match(/\n/g) || []).length + 1;
  $("meta").textContent = `${r.filename} · ${r.chars.toLocaleString()} ký tự · ${lines.toLocaleString()} dòng` +
    (r.title ? ` · tiêu đề: ${r.title}` : "");
}

$("btn-view").onclick = () => {
  renderMode = !renderMode;
  $("btn-view").textContent = renderMode ? "Xem mã Markdown" : "Xem dạng render";
  showActive();
};
$("btn-copy").onclick = async () => {
  const r = results[active];
  if (!r?.ok) return;
  await navigator.clipboard.writeText(r.markdown);
  toast("Đã copy Markdown");
};
$("btn-dl").onclick = () => {
  const r = results[active];
  if (!r?.ok) return;
  saveBlob(new Blob([r.markdown], { type: "text/markdown;charset=utf-8" }), r.filename);
};
$("btn-zip").onclick = async () => {
  const items = results.filter((r) => r.ok).map((r) => ({ filename: r.filename, markdown: r.markdown }));
  if (!items.length) return;
  const res = await fetch(API("zip"), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items }),
  });
  if (!res.ok) { toast("Đóng gói thất bại"); return; }
  saveBlob(await res.blob(), "markdown.zip");
};
function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- tiện ích ---------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// Bộ render Markdown tối giản, chỉ để xem nhanh (không phải parser đầy đủ).
function miniMarkdown(md) {
  const lines = escapeHtml(md).split("\n");
  let html = "", inCode = false, inTable = false;
  // Chặn javascript:/data: trong link và ảnh.
  const safeUrl = (u) => (/^(https?:|mailto:|#|\/|\.{0,2}\/)/i.test(u) ? u : "#");
  const inline = (t) => t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (_, a, u) => `<img alt="${a}" src="${safeUrl(u)}">`)
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (_, a, u) => `<a href="${safeUrl(u)}" target="_blank" rel="noopener noreferrer">${a}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*]+)\*/g, "$1<em>$2</em>");
  for (let idx = 0; idx < lines.length; idx++) {
    const line = lines[idx].trimEnd();
    if (/^```/.test(line)) { html += inCode ? "</pre>" : "<pre>"; inCode = !inCode; continue; }
    if (inCode) { html += line + "\n"; continue; }
    const isRow = /^\s*\|.*\|\s*$/.test(line);
    if (isRow) {
      if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) continue; // dòng phân cách
      // Hàng đầu là header nếu dòng kế tiếp là dòng phân cách.
      const isHead = !inTable && /^\s*\|[\s:|-]+\|\s*$/.test((lines[idx + 1] || "").trim());
      const tag = isHead ? "th" : "td";
      const cells = line.trim().slice(1, -1).split("|")
        .map((c) => `<${tag}>${inline(c.trim())}</${tag}>`).join("");
      if (!inTable) { html += "<table>"; inTable = true; }
      html += `<tr>${cells}</tr>`;
      continue;
    }
    if (inTable) { html += "</table>"; inTable = false; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = h[1].length; html += `<h${n}>${inline(h[2])}</h${n}>`; continue; }
    if (/^\s*[-*+]\s+/.test(line)) { html += `<div style="margin-left:1.2em">• ${inline(line.replace(/^\s*[-*+]\s+/, ""))}</div>`; continue; }
    if (/^\s*\d+\.\s+/.test(line)) { html += `<div style="margin-left:1.2em">${inline(line.trim())}</div>`; continue; }
    // Lưu ý: nội dung đã qua escapeHtml nên ">" đang là "&gt;".
    if (/^\s*&gt;/.test(line)) { html += `<blockquote style="border-left:3px solid var(--border);margin:.5em 0;padding-left:.8em;color:var(--muted)">${inline(line.replace(/^\s*&gt;\s?/, ""))}</blockquote>`; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { html += "<hr>"; continue; }
    html += line.trim() ? `<p style="margin:.45em 0">${inline(line)}</p>` : "";
  }
  if (inTable) html += "</table>";
  if (inCode) html += "</pre>";
  return html;
}
let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- khởi động ---------- */
fetch(API("info")).then((r) => r.json()).then((d) => {
  $("exts").textContent = "Hỗ trợ: " + d.extensions.map((e) => e.slice(1)).join(", ");
}).catch(() => {});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") $("go").click();
});
</script>
</body>
</html>
