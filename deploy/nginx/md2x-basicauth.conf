# md2x — bản có đặt mật khẩu (md2x không có sẵn xác thực).
#
# Tạo file mật khẩu trước:
#   sudo apt install apache2-utils        # Debian/Ubuntu
#   sudo htpasswd -c /etc/nginx/.htpasswd-md2x tenanh
#   sudo chown root:www-data /etc/nginx/.htpasswd-md2x && sudo chmod 640 /etc/nginx/.htpasswd-md2x
#
# Đây là md2x.conf + Basic Auth + giới hạn tần suất. Dùng thay cho md2x.conf.

upstream md2x_backend {
    server 127.0.0.1:8765;
    keepalive 16;
}

# Giới hạn: 10 request convert / phút / IP, cho phép dồn 20 request.
limit_req_zone $binary_remote_addr zone=md2x_convert:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name md2x.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name md2x.example.com;

    ssl_certificate     /etc/letsencrypt/live/md2x.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/md2x.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- Mật khẩu cho toàn site ---
    auth_basic           "md2x";
    auth_basic_user_file /etc/nginx/.htpasswd-md2x;

    client_max_body_size 200m;
    client_body_timeout  300s;
    proxy_send_timeout   600s;
    proxy_read_timeout   600s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json text/html text/css application/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/md2x.access.log;
    error_log  /var/log/nginx/md2x.error.log;

    location / {
        proxy_pass http://md2x_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Chống lạm dụng: endpoint convert tốn CPU nhất.
    location /api/convert {
        limit_req zone=md2x_convert burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://md2x_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Health-check: không cần mật khẩu để monitor gọi được.
    location = /healthz {
        auth_basic off;
        proxy_pass http://md2x_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}
