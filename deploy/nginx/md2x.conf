# md2x — nginx reverse proxy (một domain riêng, có HTTPS)
#
# Cài đặt:
#   sudo cp deploy/nginx/md2x.conf /etc/nginx/sites-available/md2x.conf
#   sudo ln -s /etc/nginx/sites-available/md2x.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Trên RHEL/CentOS/Alma thì chép vào /etc/nginx/conf.d/md2x.conf (không cần symlink).
#
# Đổi "md2x.example.com" thành domain thật trước khi dùng.
# Lấy chứng chỉ:  sudo certbot --nginx -d md2x.example.com

upstream md2x_backend {
    server 127.0.0.1:8765;
    keepalive 16;
}

# ---------- HTTP: chuyển hết sang HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name md2x.example.com;

    # Chừa đường cho certbot gia hạn chứng chỉ.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx < 1.25.1 không có directive này — khi đó xoá dòng dưới và
    # đổi hai dòng listen thành: listen 443 ssl http2;
    http2 on;
    server_name md2x.example.com;

    ssl_certificate     /etc/letsencrypt/live/md2x.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/md2x.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Giới hạn upload. PHẢI >= MD2X_MAX_FILE_MB của app (mặc định 200MB),
    # nếu không nginx chặn trước và client nhận 413.
    client_max_body_size 200m;
    client_body_timeout  300s;
    # Nhận hết body vào buffer/temp rồi mới chuyển cho app — upstream không bị
    # giữ kết nối trong lúc client upload chậm.
    client_body_buffer_size 1m;

    # Convert file lớn (pdf, xlsx nhiều sheet) có thể lâu; URL/YouTube còn lâu hơn.
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # Header bảo mật cơ bản.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Nén phản hồi JSON (Markdown trả về dạng JSON, nén rất tốt).
    gzip on;
    gzip_types application/json text/html text/css application/javascript text/markdown;
    gzip_min_length 1024;
    gzip_proxied any;

    access_log /var/log/nginx/md2x.access.log;
    error_log  /var/log/nginx/md2x.error.log;

    location / {
        proxy_pass http://md2x_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Trả Markdown ngay khi có, không đệm lại.
        proxy_buffering off;
        proxy_request_buffering on;
    }

    # Health-check cho monitor, không ghi vào access log.
    location = /healthz {
        proxy_pass http://md2x_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}
