# md2x — đặt dưới subpath của một site sẵn có, ví dụ https://tool.example.com/md2x/
#
# Chép đoạn location bên dưới vào server block đang có của anh.
# UI đã dùng đường dẫn tương đối nên chạy được dưới subpath mà không cần sửa code.
#
# Lưu ý hai dòng location: "/md2x" (không có "/") redirect sang "/md2x/" để
# đường dẫn tương đối trong trang không bị tính sai gốc.

location = /md2x {
    return 301 /md2x/;
}

location /md2x/ {
    # Dấu "/" ở cuối proxy_pass sẽ cắt bỏ tiền tố /md2x/ trước khi chuyển cho app.
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /md2x;

    client_max_body_size 200m;
    client_body_timeout  300s;
    proxy_send_timeout   600s;
    proxy_read_timeout   600s;
    proxy_buffering off;
}
